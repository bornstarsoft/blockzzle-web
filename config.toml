baseURL = "https://blockzzle.com/"
languageCode = "en-us"
title = "Blockzzle"

enableRobotsTXT = true
buildFuture = false

# 불필요한 페이지 생성 끄기
disableKinds = ["taxonomy", "term", "RSS"]

[sitemap]
changefreq = "daily"
filename = "sitemap.xml"
priority = 0.5

[pagination]
pagerSize = 10

[params]
  description = "Free block puzzle game. No install. Just play."

# [하단 필수 메뉴]
[[params.footer_menu]]
  name = "Privacy"
  url = "/privacy/"

[[params.footer_menu]]
  name = "Terms"
  url = "/terms/"

[[params.footer_menu]]
  name = "Contact"
  url = "/contact/"
